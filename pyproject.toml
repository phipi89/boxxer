[project]
name = "boxxer"
version = "0.1.0"
description = "Inspect, repair, and resize plotter-cut cardboard box nets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "shapely>=2.1,<3",
    "svgpathtools>=1.8,<2",
    "questionary>=2,<3",
    "rich>=13,<15",
    "ezdxf>=1.4,<2",
]

[project.scripts]
boxxer = "boxxer.cli:main"

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boxxer"]

[tool.hatch.build.targets.wheel.force-include]
"presets" = "boxxer/presets"

[tool.hatch.build.targets.sdist]
include = ["src/", "presets/", "tests/", "scripts/", "docs/", "README.md", "pyproject.toml", "uv.lock",
           "rotational.svg", "second.svg", "drafts/", "examples/"]
